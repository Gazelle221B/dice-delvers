name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri v2 の Linux 依存 (https://v2.tauri.app/start/prerequisites/#linux)
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C ~/.cargo/bin
      - run: cargo fmt --all -- --check
      # src-tauri の generate_context! は frontendDist の存在を要求するので先に WASM をビルドする
      - name: trunk build --release
        working-directory: crates/app
        run: trunk build --release
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
